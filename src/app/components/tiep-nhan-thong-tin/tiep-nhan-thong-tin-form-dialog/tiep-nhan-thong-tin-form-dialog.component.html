<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Số TNTT</mat-label>
      <input matInput formControlName="soTNTT" placeholder="Số TNTT" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Điện áp</mat-label>
      <input matInput formControlName="dienAp" placeholder="Điện áp" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Số lượng</mat-label>
      <input matInput type="number" formControlName="soLuong" min="0" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tiêu chuẩn</mat-label>
      <input matInput formControlName="tieuChuan" placeholder="VD: 96,18" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phụ kiện kèm theo</mat-label>
      <input matInput formControlName="phuKienKemTheo" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Khách hàng</mat-label>
      <input matInput formControlName="khachHang" placeholder="Khách hàng" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày nhận</mat-label>
      <input matInput [matDatepicker]="picker1" formControlName="ngayNhan" />
      <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày giao</mat-label>
      <input matInput [matDatepicker]="picker2" formControlName="ngayGiao" />
      <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày lưu</mat-label>
      <input matInput [matDatepicker]="picker3" formControlName="ngayLuu" />
      <mat-datepicker-toggle matIconSuffix [for]="picker3"></mat-datepicker-toggle>
      <mat-datepicker #picker3></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Người thực hiện (P. Kỹ thuật)</mat-label>
      <input matInput formControlName="nguoiThucHien" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày hoàn thành</mat-label>
      <input matInput [matDatepicker]="picker4" formControlName="ngayHoanThanh" />
      <mat-datepicker-toggle matIconSuffix [for]="picker4"></mat-datepicker-toggle>
      <mat-datepicker #picker4></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ghi chú</mat-label>
      <textarea matInput formControlName="ghiChu" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Hủy</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || isSaving">
    {{ isSaving ? 'Đang lưu...' : 'Lưu' }}
  </button>
</mat-dialog-actions>
