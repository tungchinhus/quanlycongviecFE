<h2 mat-dialog-title>{{ getTitle() }}</h2>
<mat-dialog-content>
  <form [formGroup]="tsMayForm">
    <!-- Row 1: Công suất và Số máy -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Công suất</mat-label>
        <input matInput type="number" formControlName="congSuat">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Số máy *</mat-label>
        <input matInput formControlName="soMay">
      </mat-form-field>
    </div>

    <!-- Row 2: SBB và LSX -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>SBB</mat-label>
        <input matInput formControlName="sbb">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>LSX</mat-label>
        <input matInput formControlName="lsx">
      </mat-form-field>
    </div>

    <!-- Row 3: T.Chuẩn LSX và TBKT -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>T.Chuẩn LSX</mat-label>
        <input matInput formControlName="tChuanLSX">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>TBKT</mat-label>
        <input matInput formControlName="tbkt">
      </mat-form-field>
    </div>

    <!-- Row 4: Po và Io -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Po</mat-label>
        <input matInput formControlName="po">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Io</mat-label>
        <input matInput formControlName="io">
      </mat-form-field>
    </div>

    <!-- Row 5: Pk75(H1) và Pk75(H2) -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Pk75(H1)</mat-label>
        <input matInput formControlName="pk75H1">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Pk75(H2)</mat-label>
        <input matInput formControlName="pk75H2">
      </mat-form-field>
    </div>

    <!-- Row 6: Uk75(H1) và Uk75(H2) -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Uk75(H1)</mat-label>
        <input matInput formControlName="uk75H1">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Uk75(H2)</mat-label>
        <input matInput formControlName="uk75H2">
      </mat-form-field>
    </div>

    <!-- Row 7: Uđm HV(H1) và Uđm HV(H2) -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Uđm HV(H1)</mat-label>
        <input matInput formControlName="udmHVH1">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Uđm HV(H2)</mat-label>
        <input matInput formControlName="udmHVH2">
      </mat-form-field>
    </div>

    <!-- Row 8: Uđm LV và Phase -->
    <div class="form-row-two">
      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Uđm LV</mat-label>
        <input matInput formControlName="udmLV">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-flex">
        <mat-label>Pha</mat-label>
        <mat-select formControlName="phase">
          <mat-option value="">-- Chọn pha --</mat-option>
          <mat-option value="1">1 pha</mat-option>
          <mat-option value="3">3 pha</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    <mat-icon>close</mat-icon>
    {{ isViewMode() ? 'Đóng' : 'Hủy' }}
  </button>
  <button 
    *ngIf="!isViewMode()" 
    mat-raised-button 
    color="primary" 
    (click)="onSave()"
    [disabled]="isLoading || tsMayForm.invalid">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
</mat-dialog-actions>
