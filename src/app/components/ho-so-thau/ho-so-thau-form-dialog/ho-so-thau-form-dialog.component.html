<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Số HST</mat-label>
      <input matInput formControlName="soHST" placeholder="VD: 01/2026" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Đơn vị mời thầu</mat-label>
      <input matInput formControlName="donViMoiThau" placeholder="Đơn vị mời thầu" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Số TBMT IB</mat-label>
      <input matInput formControlName="soTBMTIB" placeholder="VD: IB2500602544" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày nhận</mat-label>
      <input matInput [matDatepicker]="picker1" formControlName="ngayNhan" />
      <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ngày giao phòng KD</mat-label>
      <input matInput [matDatepicker]="picker2" formControlName="ngayGiaoPhongKD" />
      <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ghi chú</mat-label>
      <textarea matInput formControlName="ghiChu" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Hủy</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || isSaving">
    {{ isSaving ? 'Đang lưu...' : 'Lưu' }}
  </button>
</mat-dialog-actions>
